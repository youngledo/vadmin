name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Java 25 Maven verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            **/pom.xml
            .mvn/wrapper/maven-wrapper.properties

      - name: Show Maven Wrapper version
        run: ./mvnw -v

      - name: Verify Docker daemon for Testcontainers
        run: docker info

      - name: Verify
        run: ./mvnw -B -ntp verify

      - name: Verify production build
        run: ./mvnw -B -ntp -Pproduction verify

      - name: Build container image
        run: docker build -t vadmin:ci .
