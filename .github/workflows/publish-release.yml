name: Publish Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish, for example v0.1.0
        required: true
        type: string
      dry_run:
        description: Build and sign without uploading to Maven Central
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: maven-central-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ inputs.release_tag }}
    environment:
      name: vadmin
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Set up Java and publishing credentials
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            **/pom.xml
            .mvn/wrapper/maven-wrapper.properties
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Validate release tag and Maven version
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use the vX.Y.Z format."
            exit 1
          fi

          if [[ "$(git describe --tags --exact-match HEAD)" != "$RELEASE_TAG" ]]; then
            echo "Checked-out commit is not the requested release tag."
            exit 1
          fi

          version=$(sed -n 's@^[[:space:]]*<version>\([^<]*\)</version>.*@\1@p' pom.xml | head -n 1)
          if [[ -z "$version" ]]; then
            echo "Could not read the Maven project version."
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Tag $RELEASE_TAG does not match Maven version $version."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and sign release artifacts
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./mvnw -B -ntp -Pproduction,central-release -DskipPublishing=true deploy

      - name: Publish to Maven Central
        if: inputs.dry_run == false
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./mvnw -B -ntp -Pproduction,central-release deploy

      - name: Create GitHub Release
        if: inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "VAdmin $RELEASE_VERSION"
