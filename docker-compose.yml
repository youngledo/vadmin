services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  app:
    build:
      context: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_BOOTSTRAP_PASSWORD: ${APP_BOOTSTRAP_PASSWORD}
      APP_FILE_STORAGE_DIRECTORY: /var/lib/vaadin-admin-starter/files
    ports:
      - "8080:8080"
    volumes:
      - application-files:/var/lib/vaadin-admin-starter/files
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  application-files:
