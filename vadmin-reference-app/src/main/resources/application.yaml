spring:
  application:
    name: vadmin
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/vadmin}
    username: ${DATABASE_USERNAME:vadmin}
    password: ${DATABASE_PASSWORD:vadmin}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
app:
  bootstrap:
    password: ${APP_BOOTSTRAP_PASSWORD:}
  appearance:
    visual-language: ${APP_APPEARANCE_VISUAL_LANGUAGE:vaadin}
    density: ${APP_APPEARANCE_DENSITY:comfortable}
  identity:
    oidc:
      links: []
